description: 'The NASA/ESA Hubble Space Telescope completed its 200,000th orbit around
  Earth on 19 September 2026, marking another new milestone for an observatory that
  continues to transform our understanding of the Universe. Hubble has traveled more
  than 8 billion kilometres around Earth over its 36-year lifetime, exceeding 1.7
  million total observations. An observation completed on the day of the 200,000th
  orbit pertains to one of Hubble’s defining scientific legacies: measuring the expansion
  rate of the universe, or the Hubble Constant. The image takes advantage of the telescope’s
  ability to return to the same regions of the sky over time to monitor for the reappearance
  of a supernova, or explosion of a star, called Athena. Massive galaxy cluster MACS
  J0417, located at the left center of the image, acts as a gravitational lens, bending
  and magnifying light from objects far behind it. Light from a supernova can reach
  Earth along multiple paths, causing the same stellar explosion to appear more than
  once at times separated by months or even years depending on the path it took. Supernova
  Athena, discovered by the NASA/ESA/CSA James Webb Space Telescope in 2025, is predicted
  to reappear between now and early March 2027. Measuring the timing of Athena’s reappearances
  can help researchers map the mass of MACS J0417, which acts as a magnifying, foreground
  lens for distant objects, and refine our understanding of the expansion rate of
  the universe. After more than 36 years in space, Hubble still is reaching new heights
  of scientific productivity and impact. Hubble’s unique ability to observe and analyze
  light in ultraviolet and visible wavelengths complements other observatories’ capabilities.
  As a result, demand for Hubble observing time remains high as astronomers request
  about seven times as much observing time as is available each year. Hubble continues
  to observe targets across every area of astronomy around the clock. [Image description:
  A dense galaxy cluster fills the image, with bright galaxies concentrated near the
  centre and numerous more distant galaxies visible throughout the dark background,
  including several faint, elongated arcs distorted by gravitational lensing.]'
foreground_image_set_url: https://data1.wwtassets.org/feeds/hst/opo2623/L{1}X{2}Y{3}.png
name: Hubble seeks lensed supernova, marks 200,000 orbits
