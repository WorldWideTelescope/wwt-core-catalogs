  The AI tool allowed them to sift through nearly 100 million image cutouts in just
  days, turning up rare and anomalous objects like this one. A small collection of
  gravitationally interacting galaxies has been found here. Galaxy mergers are relatively
  common — they were the most abundant type of anomaly found by the researchers —
  and are easily identified by the distorted shapes of the galaxies’ discs and the
  tidal tails stretching out between them, caused by the massive gravitational forces
  slowly pulling each galaxy apart. Eventually the galaxies we see here will be totally
  disrupted and finally settle into the shape of a single galaxy, most likely an elliptical
  galaxy. Read more about this new research here. [Image description: A small image
