description: ERIS, the Very Large Telescope’s newest infrared eye on the sky, captured
  this stunning image of the inner ring of the galaxy NGC 1097. This galaxy is located
  45 million light-years away from Earth, in the constellation Fornax. ERIS has captured
  the gaseous and dusty ring that lies at the very centre of the galaxy. The bright
  spots in the ring are stellar nurseries, shown in unprecedented detail. The centre
  of this galaxy is active, with a supermassive black hole that feeds off its surroundings.
  This image has been taken through four different filters by ERIS’s state-of-the-art
  infrared imager, the Near Infrared Camera System — or NIX. The filters have been
  represented here by blue, green, red and magenta, where the last one highlights
  the compact regions in the ring. To put NIX’s resolution in perspective, this image
  shows, in detail, a portion of the sky less than 0.03% the size of the full Moon.
