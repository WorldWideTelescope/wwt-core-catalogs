description: 'The supernova remnant 3C 58 contains a spinning neutron star , known
  as PSR J0205+6449, at its center. Astronomers studied this neutron star and others
  like it to probe the nature of matter inside these very dense objects. A new study,
  made using NASA’s Chandra X-ray Observatory and ESA’s XMM-Newton, reveals that the
  interiors of neutron stars may contain a type of ultra-dense matter not found anywhere
  else in the Universe, as reported in our latest press release .


  In this image of 3C 58, low-energy X-rays are colored red, medium-energy X-rays
  are green, and the high-energy band of X-rays is shown in blue. The X-ray data have
  been combined with an optical image in yellow from the Digitized Sky Survey. The
  Chandra data show that the rapidly rotating neutron star (also known as a “pulsar”)
  at the center is surrounded by a torus of X-ray emission and a jet that extends
  for several light-years . The optical data shows stars in the field.'
foreground_image_set_url: https://data1.wwtassets.org/feeds/chandra/2024-3c58/L{1}X{2}Y{3}.png
name: 3C 58
ra_hr: 2.0937023739212677
