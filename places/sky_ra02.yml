description: This image shows the orientation of the magnetic field in the distant
  9io9 galaxy, seen here when the Universe was only 20% of its current age — the furthest
  ever detection of a galaxy’s magnetic field. The observations were done with the
  Atacama Large Millimeter/submillimeter Array (ALMA), in which ESO is a partner.
  Dust grains within 9io9 are somewhat aligned with the galaxy’s magnetic field, and
  due to this they emit polarised light, meaning that light waves oscillate along
  a preferred direction rather than randomly. ALMA detected this polarisation signal,
  from which astronomers could work out the orientation of the magnetic field, shown
  here as curved lines overlaid on the ALMA image. The polarised light signal emitted
  by the magnetically aligned dust in 9io9 was extremely faint, representing just
  one percent of the total brightness of the galaxy, so astronomers used a clever
  trick of nature to help them obtain this result. The team was helped by the fact
  that 9io9, although very distant from us, had been magnified via a process known
  as gravitational lensing. This occurs when light from a distant galaxy, in this
  case 9io9, appears brighter and distorted as it is bent by the gravity of a very
  large object in the foreground.
foreground_image_set_url: https://data1.wwtassets.org/feeds/eso/eso2316a/L{1}X{2}Y{3}.png
name: ALMA view of the 9io9 galaxy
