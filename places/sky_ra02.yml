description: This packed ESA/Hubble Picture of the Week showcases the galaxy cluster
  ACO S 295, as well as a jostling crowd of background galaxies and foreground stars.
  Galaxies of all shapes and sizes populate this image, ranging from stately spirals
  to fuzzy ellipticals. As well as a range of sizes, this galactic menagerie boasts
