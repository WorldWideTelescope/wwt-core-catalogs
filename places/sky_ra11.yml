description: This image was obtained with the wide-field view of the Mosaic camera
  on the Mayall 4-meter telescope at Kitt Peak National Observatory. NGC 3628 is a
  large, edge-on spiral galaxy. It is one of three galaxies in the &quot;Leo Triplet&quot;.
  NGC 3628 has a warped disk and a long tidal tail (the faint blue line stretching
  to the upper-left corner of the image) that are the result of gravitational interactions
  with the other two galaxies in the triplet. The image was generated with observations
  in the B (blue), V (green), I (orange) and Hydrogen-Alpha (red) filters. This image
  is rotated 37 degrees clockwise fron North is up, East is to the left.
foreground_image_set_url: http://data1.wwtassets.org/feeds/noirlab/noao-ngc3628/L{1}X{2}Y{3}.png
