description: 'Using the NASA/ESA/CSA James Webb Space Telescope, an international
  team of astronomers have found new galaxies in the Spiderweb protocluster. Their
  characteristics shed light on the growth of galaxies in these large cosmic cities,
  with the finding that gravitational interactions in these dense regions are not
  as important as previously thought. With the use of Webb’s capabilities, astronomers
  have now sought to better understand this protocluster and to reveal new galaxies
  within it. Infrared radiation passes more freely through cosmic dust than visible
  light, which is scattered by the dust. Because Webb can see infrared light very
  well, scientists used it to observe regions of the Spiderweb that were previously
  hidden to us by cosmic dust, and to find out to what degree this dust obscures them.
  This image shows the Spiderweb protocluster as seen by Webb’s NIRCam (Near-InfraRed
  Camera). [Image description: Hundreds of galaxies appear in this view, which is
  set against the black background of space. There are many overlapping objects at
  various distances. They include large, blue foreground stars, some with eight diffraction
  spikes, and white and pink spiral and elliptical galaxies. Numerous tiny orange
  dots appear throughout the scene.]'
