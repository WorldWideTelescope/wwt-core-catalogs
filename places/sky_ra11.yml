description: 'This Picture of the Week prominently features two galaxies: NGC 3558
  in the lower left, and LEDA 83465 in the upper right. Both galaxies lie roughly
  450 million light years from Earth. The two galaxies are separated from one another
  by a distance of roughly 150 000 light years, which might sound vast, until we consider
  that our nearest galactic neighbour — the Andromeda galaxy — is a whopping 2.5 million
  light years distant from the Milky Way galaxy. In galactic terms, the two galaxies
  pictured here are practically on top of one another. This is because they belong
  to a crowded and chaotic galaxy cluster known as Abell 1185, which is packed with
  galaxies that are interacting with one another via gravity. These galactic interactions
  have sometimes led to dramatic results, such as galaxies being torn apart completely.
  This fate has not befallen NGC 3558, which currently retains its integrity as both
  an elliptical galaxy and a low-ionisation nuclear emission-line region, or LINER.
  In fact, it probably attained its present form by devouring smaller galaxies in
  the cluster — galaxies much like LEDA 83465. LINERs are a particular type of galactic
  nucleus or core, and are distinguished by the chemical fingerprints written into
  the light that they emit. As their name suggests, LINERs emit light which suggests
  that many of the atoms and molecules within these galactic cores have either been
  weakly ionised or not ionised at all. Ionisation is the process by which atoms or
  molecules lose or gain electrons. In galaxies, it is driven by a variety of processes
  — from shockwaves travelling through galaxies, to radiation from massive stars or
  from hot gas in accretion discs. In the case of LINERs, this means that many of
  the atoms and molecules within the galaxies have lost either a single electron,
  or have retained all their electrons. The mechanism that drives this weak ionisation
  in LINERs such as NGC 3558 is still debated amongst astronomers. [Image Description:
  Two galaxies are prominent among many much smaller background galaxies in the darkness
  of space. The larger galaxy is an elliptical galaxy, radiating light in a perfectly
  even sphere from a bright centre. The smaller galaxy is a barred spiral, with arms
  that are wispy like fog connected to a bar crossing the galaxy’s shining core. The
  shape of the arms makes the smaller galaxy notably squarish.]'
foreground_image_set_url: https://data1.wwtassets.org/feeds/hst/potw2341a/L{1}X{2}Y{3}.png
