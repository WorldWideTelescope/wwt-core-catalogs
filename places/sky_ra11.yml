description: The central cluster is the densest concentration of massive stars known
  in the Milky Way. The field shown is about 2.5 x 2.5 light-years 2. It hosts more
  than 50 hot O-type stars. The brightest star in the field is the red supergiant
  IRS4 ; it is located about 80 arcsec NE of the center. About 18 arcsec N of the
  center are the ring nebula and the bipolar outflows around the blue supergiant Sher25.
  The photo also shows three proplyd-like objects ; they are similar to those seen
  in Orion Nebula, but 20-30 times more extended. About 1 arcmin SSE of the central
  cluster are seen the brightest members of the deeply embedded proto cluster IRS9
  .
