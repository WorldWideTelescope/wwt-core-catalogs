description: 'This image shows a portion of the galaxy cluster MACS J1149.5+2223,
  as seen by Webb’s Near-Infrared Camera (NIRCam). With Webb’s excellent sensitivity
  to infrared light and the hours of exposure time combined in this image, distant
  galaxies (red colours) are brought out of the darkness. Other galaxies glow strongly
  from the abundance of light they radiate. These observations come from the CANUCS
  survey (#1208, PI: C. J. Willott). The survey employed Webb’s advanced instruments,
  including NIRCam, NIRISS and NIRSpec, to capture detailed images and spectra of
  massive galaxy clusters in infrared light. Astronomers could then study low-mass
  galaxies in these early clusters at early stages of evolution. Because of how Webb’s
  instruments work, for each cluster the survey targeted both the cluster’s centre,
  where the brightest and largest galaxies are gathered, and a “parallel field” of
  a neighbouring area within the cluster. This image features one of these parallel
  fields. Researchers studying the data from the CANUCS survey uncovered a distant
  galaxy, named CANUCS-LRD-z8.6, in this parallel field. The galaxy is extremely distant
  (seen only 570 million years after the Big Bang) and the team’s research revealed
  that it hosts a supermassive black hole that is unusually large for such an early
  stage in the Universe. This result challenges existing theories about the formation
  of galaxies and black holes in the early Universe. [Image description: An image
